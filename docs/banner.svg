<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="vouchsafe — passkey login, zero dependencies">
  <defs>
    <clipPath id="vs-reveal-title">
      <rect x="0" y="0" width="0" height="200">
        <animate attributeName="width" from="0" to="870" dur="1.1s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </clipPath>
    <clipPath id="vs-reveal-sub">
      <rect x="0" y="0" width="0" height="200">
        <animate attributeName="width" from="0" to="870" dur="1.3s" begin="1.25s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="200" rx="12" fill="#0b0d11"/>
  <rect x="1" y="1" width="898" height="198" rx="11" fill="none" stroke="#232833" stroke-width="1"/>

  <!-- shield-with-check mark: vouches for a credential -->
  <g transform="translate(48,58)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.1s" fill="freeze"/>
    <path d="M40 2 L74 16 L74 46 C74 70 58 82 40 90 C22 82 6 70 6 46 L6 16 Z"
          fill="#101d1a" stroke="#5eead4" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M23 46 L35 58 L59 30" fill="none" stroke="#5eead4" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="52" stroke-dashoffset="52">
      <animate attributeName="stroke-dashoffset" from="52" to="0" dur="0.6s" begin="1.5s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
    </path>
  </g>

  <g clip-path="url(#vs-reveal-title)">
    <text x="150" y="100" font-family="Consolas, 'Cascadia Code', 'SF Mono', monospace" font-size="54" font-weight="700" fill="#e8ecf1">vouchsafe</text>
  </g>

  <g clip-path="url(#vs-reveal-sub)">
    <text x="152" y="138" font-family="Consolas, 'Cascadia Code', 'SF Mono', monospace" font-size="18" fill="#9aa4b2">passkey login &#8226; empty dependency file &#8226; no passwords stored</text>
  </g>
</svg>
